[package]
name = "yitu-go"
version = "1.0.0"
description = "弈途围棋 —— 面向新手的围棋学习与对弈应用"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yitu_go_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
